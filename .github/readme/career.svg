<title id="t">Career as a git log --graph</title><desc id="d">A terminal running git log --graph --oneline, newest first. c0ffee1 (HEAD -&gt; main): Senior AI Engineer at MerchantSpring, 2026 to present, marketplace analytics for e-commerce sellers and agencies, full-stack across backend services, data pipelines and frontend. 5afe5ed (side-quest/bowiq), an unmerged branch opened in 2023 and still open: CAD Designer and 3D Printing Engineer at Bowiq, side work. 5ca1ab1: Full-Stack Developer at Supa (formerly Supahands), 2020 to 2025, built data-labeling and AI training-data tooling end to end and shipped LLM evaluation tooling including the open-source LLM Comparison app. 0ddba11: git init, joined GitHub in 2016.</desc>
